[package]
name = "mara_3d"
# HOST TIER (PLAN.md decision F1): this crate drives the `three-d`
# renderer and an optional wgpu preview path, so it names backend
# types by necessity and is NOT part of the sealed `crates/modules/*`
# tier. Depending on it couples you to three-d and wgpu.
description = "Mara 3D scene/view backed by three-d. HOST TIER: names wgpu; not a sealed module."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytemuck = { version = "1", features = ["derive"], optional = true }
egui = { workspace = true, default-features = false }
egui-wgpu = { workspace = true, optional = true }
mara_core = { workspace = true }
three-d = { version = "0.19", default-features = false }
wgpu = { workspace = true, optional = true }

[features]
default = []
gpu-preview = ["dep:bytemuck", "dep:egui-wgpu", "dep:wgpu"]
