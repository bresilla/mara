[workspace]
resolver = "3"
members = [
    "crates/gpu",
    "mara",
    "mara/plugin/bevy",
    "crates/core",
    "crates/modules/code",
    "crates/modules/graph",
    "crates/modules/image",
    "crates/modules/canvas",
    "crates/modules/board",
    "crates/modules/map",
    "hosts/three_d",
    "hosts/bevy",
    "example",
    "example/sealed",
]


[workspace.package]
version = "0.4.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/bresilla/bevy_mara"

[workspace.dependencies]
# Shared egui / egui-ecosystem dependency versions — every member
# crate pulls egui through `workspace = true` so the workspace
# compiles against a single resolved egui.
egui = { version = "0.34", default-features = false }
# egui-wgpu — used by `mara_graph::node_view` to render a
# secondary egui::Context into an offscreen wgpu texture, so node
# graph editors stay sharp at any zoom level (sub-context's
# pixels_per_point compensates for zoom). Mara owns egui, so this
# stays in the Mara/egui stack instead of routing through a Bevy
# egui bridge.
egui-wgpu = { version = "0.34", default-features = false }
wgpu = { version = "29", default-features = false }
# Bevy is used as embedded viewport/content, not as Mara's egui host.
bevy = { version = "0.19", default-features = false }

# Internal crates.
#
# Layout — the directory a crate lives in IS its seal tier:
#
#   crates/core          the UI core; the only crate that may name egui
#                        (until it is split into mara_backend_egui)
#   crates/gpu           opaque GPU handles shared between hosts and modules
#   crates/modules/      SEALED tier. A crate here names no backend type —
#                        no egui, no egui-wgpu, no wgpu. Enforced by
#                        `make check`, and by `cargo tree` once the backend
#                        crate is split out.
#   hosts/               HOST tier. These own a renderer and therefore
#                        legitimately name wgpu: `mara_bevy` drives an
#                        embedded Bevy app, `mara_3d` drives `three-d`.
#                        Bevy and three-d hand back wgpu resources, so no
#                        amount of wrapping hides them — the honest answer
#                        is a declared tier, not a pretend-sealed module.
#                        See PLAN.md decision F1.
#   mara/                public facade: `mara::ui` for UI-only consumers,
#                        `mara::window` for Mara-owned native windows
#   mara/plugin/         optional compatibility/helper crates
#
# `mara_core` — UI core (panes, ribbons, containers, pods, widgets,
# theme, embed mechanism). Package id is `mara_core`, which avoids
# shadowing Rust's std `core` in derive expansions.
mara_core = { path = "crates/core" }
mara_gpu = { path = "crates/gpu" }
# `mara_graph` — standalone vendored node-graph crate (forked from
# `egui-snarl`, see `crates/modules/graph/ACKNOWLEDGEMENTS.md`
# for upstream attribution). Usable in any egui app; ships
# sensible defaults, no mara-theming dep.
mara_graph = { path = "crates/modules/graph" }
# `mara_code` — standalone vendored egui_code_editor. Usable in
# any egui app; ships sensible defaults, no mara-theming dep.
mara_code = { path = "crates/modules/code" }
# `mara_image` — lightweight image viewer/editor proof module for
# the new View + Module architecture.
mara_image = { path = "crates/modules/image" }
# `mara_canvas` — retained-stroke whiteboard proof module for
# recursive View + Module workspaces.
mara_canvas = { path = "crates/modules/canvas" }
# `mara_board` — pixel-drawing Board surface/view for the multiview layer.
mara_board = { path = "crates/modules/board" }
# `mara_map` — retained f64 map annotations and a Mara map component.
mara_map = { path = "crates/modules/map" }
# `mara_3d` — retained scene/camera/object 3D module surface backed by three-d.
mara_3d = { path = "hosts/three_d" }
# `mara_bevy` — embedded Bevy viewport module for egui/Mara hosts.
mara_bevy = { path = "hosts/bevy" }

# ── Build profile tuning ────────────────────────────────────────────
#
# Per Bevy's "Optimisations" cheat-sheet: dev builds are 10–50× slower
# than release on hot ECS / tessellator paths because Bevy's deps
# compile at the workspace's dev `opt-level` (= 0 by default). We
# bump every dependency to `opt-level = 3` while keeping our own
# crates at `0` for fast incremental rebuilds. The single most-
# common reason "Bevy feels slow" in dev mode.

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
