[workspace]
resolver = "3"
members = [
    "mara",
    "mara/plugin/bevy",
    "crates/core",
    "crates/modules/code",
    "crates/modules/graph",
    "crates/modules/image",
    "crates/modules/canvas",
    "crates/modules/map",
    "crates/modules/three_d",
    "crates/modules/bevy",
    "example",
]


[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/bresilla/bevy_mara"

[workspace.dependencies]
# Shared egui / egui-ecosystem dependency versions — every member
# crate pulls egui through `workspace = true` so the workspace
# compiles against a single resolved egui.
egui = { version = "0.33", default-features = false }
# egui-wgpu — used by `mara_core::extras::node_view` to render a
# secondary egui::Context into an offscreen wgpu texture, so node
# graph editors stay sharp at any zoom level (sub-context's
# pixels_per_point compensates for zoom). Both `bevy_egui` and
# eframe's wgpu backend ultimately use egui-wgpu under the hood,
# so making mara_core depend on it directly keeps the rendering
# code host-agnostic.
egui-wgpu = { version = "0.33", default-features = false }
wgpu = { version = "27", default-features = false }
# bevy + bevy_egui are only used by `bevy_mara`; listed here so
# the version is managed in one place.
bevy = { version = "0.18", default-features = false }
bevy_egui = { version = "0.39", default-features = false }

# Internal crates.
#
# Layout:
#   crates/  ← standalone library crates (UI, node graph, code editor)
#   mara/        ← public facade with two modes:
#                    `mara::ui` for UI-only consumers, and
#                    `mara::window` for Mara-owned native windows
#   mara/plugin/ ← host-specific integration plugins such as Bevy
#
# `mara_core` — UI core (panes, ribbons, containers, pods, widgets,
# theme, embed mechanism). Package id is `mara_core`, which avoids
# shadowing Rust's std `core` in derive expansions.
mara_core = { path = "crates/core", version = "0.2.0" }
# `mara_graph` — standalone vendored node-graph crate (forked from
# `egui-snarl`, see `crates/modules/graph/ACKNOWLEDGEMENTS.md`
# for upstream attribution). Usable in any egui app; ships
# sensible defaults, no mara-theming dep.
mara_graph = { path = "crates/modules/graph", version = "0.2.0" }
# `mara_code` — standalone vendored egui_code_editor. Usable in
# any egui app; ships sensible defaults, no mara-theming dep.
mara_code = { path = "crates/modules/code", version = "0.2.0" }
# `mara_image` — lightweight image viewer/editor proof module for
# the new View + Module architecture.
mara_image = { path = "crates/modules/image", version = "0.2.0" }
# `mara_canvas` — retained-stroke whiteboard proof module for
# recursive View + Module workspaces.
mara_canvas = { path = "crates/modules/canvas", version = "0.2.0" }
# `mara_map` — retained f64 map annotations and a Mara map component.
mara_map = { path = "crates/modules/map", version = "0.2.0" }
# `mara_3d` — retained scene/camera/object 3D module surface backed by three-d.
mara_3d = { path = "crates/modules/three_d", version = "0.2.0" }
# `mara_bevy` — embedded Bevy viewport module for egui/Mara hosts.
mara_bevy = { path = "crates/modules/bevy", version = "0.2.0" }

# ── Build profile tuning ────────────────────────────────────────────
#
# Per Bevy's "Optimisations" cheat-sheet: dev builds are 10–50× slower
# than release on hot ECS / tessellator paths because Bevy's deps
# compile at the workspace's dev `opt-level` (= 0 by default). We
# bump every dependency to `opt-level = 3` while keeping our own
# crates at `0` for fast incremental rebuilds. The single most-
# common reason "Bevy feels slow" in dev mode.

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
