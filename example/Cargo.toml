[package]
name = "mara_example"
description = "Root Mara example app consuming the unified Mara facade like an external application."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
mara = { path = "../mara", features = ["window", "bevy", "canvas", "board", "code", "graph", "image", "map", "three-d"] }
egui_plot = "0.35"
bevy = { workspace = true, features = ["webgl2"] }
bevy_ecs = "0.19"
tobj = "4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.34", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "x11",
] }
wgpu = { version = "29", default-features = false, features = ["vulkan"] }
egui-wgpu = { workspace = true, features = ["winit"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.34", default-features = false, features = [
    "default_fonts",
    "wgpu",
] }
wgpu = { version = "29", default-features = false, features = ["webgl"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen-futures = "0.4"
log = "0.4"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = "0.1"

[[bin]]
name = "native"
path = "src/native.rs"

[[bin]]
name = "web"
path = "src/web.rs"
