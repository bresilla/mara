[package]
name = "mara_example"
description = "Root Mara example app consuming egui_mara, bevy_mara, mara_core, and Mara modules like an external application."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
egui_mara = { path = "../api_crates/egui" }
mara_core = { workspace = true }
mara_map = { workspace = true }
egui_plot = "0.34"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.33", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "x11",
] }
wgpu = { version = "27", default-features = false, features = ["vulkan"] }
bevy_mara = { path = "../api_crates/bevy" }
egui-wgpu = { workspace = true, features = ["winit"] }
egui-winit = "0.33"
pollster = "0.4"
winit = { version = "0.30", default-features = false, features = [
    "x11",
    "wayland",
    "rwh_06",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.33", default-features = false, features = [
    "default_fonts",
    "wgpu",
] }
wgpu = { version = "27", default-features = false, features = ["webgl"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen-futures = "0.4"
log = "0.4"

[[bin]]
name = "native"
path = "src/native.rs"

[[bin]]
name = "web"
path = "src/web.rs"
