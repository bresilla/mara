[package]
name = "mara_example"
description = "Root Mara example app consuming mara, mara_core, and Mara modules like an external application."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
mara = { path = "../mara", features = ["window", "bevy"] }
mara_core = { workspace = true }
mara_map = { workspace = true }
egui_plot = "0.34"
bevy = { workspace = true, features = ["webgl2"] }
bevy_egui = { workspace = true, features = ["default_fonts", "render"] }
bevy_mara = { path = "../mara/plugin/bevy" }
bevy_ecs = "0.18"
bevy_glacial = { git = "https://github.com/bresilla/bevy_glacial.git", rev = "d7bc6d3" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.33", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "x11",
] }
wgpu = { version = "27", default-features = false, features = ["vulkan"] }
egui-wgpu = { workspace = true, features = ["winit"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.33", default-features = false, features = [
    "default_fonts",
    "wgpu",
] }
wgpu = { version = "27", default-features = false, features = ["webgl"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen-futures = "0.4"
log = "0.4"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = "0.1"

[[bin]]
name = "native"
path = "src/native.rs"

[[bin]]
name = "bevy"
path = "src/bevy.rs"

[[bin]]
name = "web"
path = "src/web.rs"
