<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Mara example — web</title>

    <style>
        /* Fill the viewport, no scrollbars; dark backdrop so there is
           no white flash before the wasm bundle paints the canvas. */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0e0e11;
        }

        canvas {
            position: absolute;
            display: block;
        }

        #mara_canvas {
            inset: 0;
            width: 100%;
            height: 100%;
            outline: none;
            background: #0e0e11;
        }
    </style>
</head>

<body>
    <!-- src/web.rs gives this canvas to eframe/Mara. -->
    <canvas id="mara_canvas"></canvas>

    <!-- Trunk compiles the Mara web entrypoint. -->
    <link data-trunk rel="rust" data-bin="web" />
</body>

</html>
