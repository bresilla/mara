[package]
name = "egui_mara_web"
description = "Small WebAssembly helpers for mounting egui_mara apps with eframe. Full demos live in the root `example/` crate."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
egui_mara = { path = "../egui" }
eframe = { version = "0.33", default-features = false, features = [
    "default_fonts",
    "wgpu",
] }
wgpu = { version = "27", default-features = false, features = ["webgl"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen-futures = "0.4"
log = "0.4"
