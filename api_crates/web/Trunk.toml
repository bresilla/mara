# Trunk build config for the egui_mara web host.
#
# `trunk serve` / `trunk build` pick this up automatically when run
# from `api_crates/web/`. The repo Makefile's `serve-web` /
# `build-web` targets do exactly that.

[build]
# The HTML entry Trunk scans for `data-trunk` links.
target = "index.html"

[serve]
# `make serve-web` opens http://localhost:8080.
port = 8080
open = false
