[package]
# The one crate that names the backend. Everything else in the
# workspace speaks `mara_core`'s seams — `UiBackend`, `MaraCtx`,
# `MaraStore`, `PainterSink` — and never sees an egui type.
name = "mara_backend_egui"
description = "egui backend for Mara. Implements mara_core's UiBackend / MaraCtx / MaraStore / PainterSink seams, plus the widget wrappers, scroll machinery and theme application that genuinely belong to a backend."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mara_core = { workspace = true }
egui = { workspace = true, default-features = false, features = ["default_fonts"] }
egui-scale = "0.4"
iconflow = { version = "1.0", default-features = false, features = ["pack-fluentui"] }
egui_extras = { version = "0.34", default-features = false, features = ["svg"], optional = true }
mara_gpu = { workspace = true, optional = true }
egui-wgpu = { workspace = true, optional = true }

[features]
default = ["svg"]
svg = ["dep:egui_extras", "mara_core/svg"]
gpu = ["dep:mara_gpu", "dep:egui-wgpu", "mara_core/gpu"]
