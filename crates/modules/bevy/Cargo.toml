[package]
name = "mara_bevy"
description = "Embedded Bevy viewport module for Mara UI hosts."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
egui = { workspace = true }
egui-wgpu = { workspace = true }
mara_gpu = { workspace = true }
mara_core = { workspace = true }
wgpu = { workspace = true }
bevy = { workspace = true, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_state",
    "bevy_log",
    "bevy_window",
    "bevy_winit",
    "bevy_input_focus",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_mesh",
    "bevy_camera",
    "bevy_image",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_scene",
    "default_font",
    "tonemapping_luts",
    "smaa_luts",
    "ktx2",
    "zstd_rust",
    "png",
    "reflect_auto_register",
] }
crossbeam-channel = "0.5"

# The Linux display backends are desktop/web only.
[target.'cfg(not(target_os = "android"))'.dependencies]
bevy = { workspace = true, features = [
    "x11",
    "wayland",
] }

# On Android, Bevy still needs `bevy_winit` — it is the only path that
# selects `android-activity`'s backend (bevy → bevy_internal → bevy_winit
# → winit/android-native-activity), which `bevy_android`/`bevy_asset`
# require. We pin it to **native-activity** to match Mara's runner: both
# winit consumers then agree on one backend, so feature unification keeps
# `android-activity` happy. `WinitPlugin` is still disabled at runtime —
# Mara owns the event loop; Bevy only borrows winit's activity glue.
[target.'cfg(target_os = "android")'.dependencies]
bevy = { workspace = true, features = [
    "android-native-activity",
] }
