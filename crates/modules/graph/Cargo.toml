[package]
name = "mara_graph"
description = "Standalone egui node-graph crate. Vendored fork of an upstream node-graph widget (see ACKNOWLEDGEMENTS.md for attribution) so we can iterate without external dep churn. Theme-neutral — call sites pick a `GraphStyle`; the mara-tinted wrapper lives in `mara::extras::graph`."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The widget-crate cycle is gone — the mara-tinted wrappers moved to the
# `mara` facade — so this crate can finally speak Mara vocab directly
# instead of duplicating a geometry type. PLAN.md WS-D1.
mara_core = { workspace = true }
mara_gpu = { workspace = true }
# The vendored renderer hands a backend surface to its own drawing
# code, so it names the backend crate directly.
mara_backend_egui = { workspace = true }
egui = { workspace = true, default-features = false }
# Used by `node_view` to render the graph into a secondary egui
# context backed by a wgpu texture, so the graph stays sharp at
# any zoom level.
egui-wgpu = { workspace = true }
wgpu = { workspace = true }
slab = { version = "0.4", features = ["serde"] }
smallvec = { version = "1.15", features = ["const_new"] }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
# Drives the serde round-trip tests. The `serde` feature had never
# compiled before PLAN_NODE.md P2, so nothing had ever exercised the
# document format; these are the first tests that do.
serde_json = "1"

[features]
# Upstream cfg gates that survived vendoring.
#
# This never compiled before PLAN_NODE.md P2: it enabled `egui/serde`
# but not `mara_core/serde`, while everything this crate actually
# serialises — `vocab::{Pos2, Vec2, Rect, Color32, Stroke}`,
# `style::FrameSpec` — is a Mara type. `egui/serde` is gone because
# nothing serialised here is an egui type.
serde = ["dep:serde", "mara_core/serde", "slab/serde"]
# Forwards `mara_core`'s offscreen-render surface. Nothing in the
# workspace enables it by default; `mara/gpu` is the entry point.
gpu = ["mara_core/gpu"]
