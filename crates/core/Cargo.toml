[package]
# Package is named `mara_core` rather than `core` — Rust's
# standard library has a `core` crate that derive macros expand to
# via `::core::clone::Clone` etc. Naming our local crate `core`
# would shadow that path and break Bevy's `#[derive(SystemSet)]`.
# The directory stays as `crates/core/`; the crate identifier is
# `mara_core`, matching the `mara_graph` / `mara_code` siblings.
name = "mara_core"
description = "UI core for the mara editor kit — pane system, ribbon strips, containers, pods, widgets, theme runtime, bundled Iosevka fonts, and an embed mechanism that lets host widgets (node graph, code editor, …) toggle between inline and full-window. Optional `graph` and `code` features pull in `mara_graph` / `mara_code` and expose mara-tinted wrappers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
egui = { workspace = true, default-features = false, features = ["default_fonts"] }
# Filled Fluent UI System Icons — used by `icons.rs` + `ribbon::paint`.
iconflow = { version = "1.0", default-features = false, features = ["pack-fluentui"] }
# Lab-space colour manipulation — `style.rs` uses it to adapt
# accents into the readable luma band per theme mode.
pastel = { version = "0.12", default-features = false }
# Optional standalone-extra crates. When the matching feature is
# enabled, the corresponding `mara_core::extras::*` re-export + the
# mara-tinted wrapper become available.
mara_graph = { workspace = true, optional = true }
mara_code = { workspace = true, optional = true }
# Optional Bevy integration. When OFF, the crate compiles as a
# pure-egui crate. When ON, `AccentColor` / `GlassOpacity` /
# ribbon resources derive `bevy::Resource`.
bevy = { workspace = true, optional = true }

[features]
# Both `graph` and `code` default-on so consumers that don't care
# about the embedded host widgets still get the same surface as
# before. Apps that want a slim UI-only build drop them via
# `default-features = false`.
default = ["graph", "code"]
graph = ["dep:mara_graph"]
code = ["dep:mara_code"]
# Unlocks the raw egui escape hatch: the `egui` crate re-export,
# `MaraUi::raw_ui_mut`, `ViewCtx::egui_ctx`, `TreeBody::ctx`,
# `PaneBody::ctx`. OFF by default so consumer code can only build
# UI through Mara's typed surface. First-party host plugins and
# module crates enable it deliberately; enabling it in an app is a
# visible, greppable opt-out of the sealed API.
raw-egui = []
# Enables `#[derive(bevy::Resource)]` + `bevy::SystemSet` on state
# types so they slot into a Bevy app as resources without wrappers.
bevy = ["dep:bevy"]
