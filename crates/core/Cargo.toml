[package]
# Package is named `mara_core` rather than `core` — Rust's
# standard library has a `core` crate that derive macros expand to
# via `::core::clone::Clone` etc. Naming our local crate `core`
# would shadow that path and break Bevy's `#[derive(SystemSet)]`.
# The directory stays as `crates/core/`; the crate identifier is
# `mara_core`, matching the `mara_graph` / `mara_code` siblings.
name = "mara_core"
description = "UI core for the mara editor kit — pane system, ribbon strips, containers, pods, widgets, theme runtime, bundled Iosevka fonts, and an embed mechanism that lets host widgets (node graph, code editor, …) toggle between inline and full-window. Depends on no widget crate: the mara-tinted `graph`/`code` wrappers live in the `mara` facade, which is what lets those crates depend on `mara_core` in turn."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
egui = { workspace = true, default-features = false, features = ["default_fonts"] }
egui-scale = "0.4"
# SVG rasterisation for `PaintCmd::Svg`. This is the ONLY thing Mara
# needs from `egui_extras`, hence `default-features = false` plus the
# single `svg` feature (which pulls `resvg`). Before this, `PaintCmd::Svg`
# was public API that silently drew nothing on every host — no rasteriser
# existed anywhere in the workspace. Behind the `svg` feature so consumers
# who never draw SVG can drop the `resvg` build cost.
egui_extras = { version = "0.34", default-features = false, features = [
    "svg",
], optional = true }
# Filled Fluent UI System Icons — used by `icons.rs` + `ribbon::paint`.
iconflow = { version = "1.0", default-features = false, features = ["pack-fluentui"] }
# Lab-space colour manipulation — `style.rs` uses it to adapt
# accents into the readable luma band per theme mode.
pastel = { version = "0.12", default-features = false }
# Offscreen UI surfaces (WS-A7) need a wgpu device + an egui-wgpu
# renderer to rasterise a subtree into its own texture. Optional so a
# UI-only build stays GPU-free.
mara_gpu = { workspace = true, optional = true }
egui-wgpu = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
# Optional Bevy integration. When OFF, the crate compiles as a
# pure-egui crate. When ON, `AccentColor` / `GlassOpacity` /
# ribbon resources derive `bevy::Resource`.
bevy = { workspace = true, optional = true }

[features]
# Both `graph` and `code` default-on so consumers that don't care
# about the embedded host widgets still get the same surface as
# before. Apps that want a slim UI-only build drop them via
# `default-features = false`.
default = ["svg"]
# Rasterise `PaintCmd::Svg`. Off means SVG paint commands draw nothing
# (the pre-0.4.2 behaviour), which is a real saving: `resvg` is a large
# dependency and most apps never draw an SVG.
svg = ["dep:egui_extras"]
# `ViewCtx::offscreen` — render a sealed UI body into its own texture at
# an independent scale. Off by default: it pulls wgpu, and only surfaces
# that need scale-independent rasterisation (node graphs, thumbnails)
# use it.
gpu = ["dep:mara_gpu", "dep:egui-wgpu", "dep:wgpu"]
# Enables `#[derive(bevy::Resource)]` + `bevy::SystemSet` on state
# types so they slot into a Bevy app as resources without wrappers.
bevy = ["dep:bevy"]

[dev-dependencies]
# `mara_gpu` types appear in the WS-A7 signature test even when the
# `gpu` feature is off for the library build.
mara_gpu = { workspace = true }
