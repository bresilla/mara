# Cargo build configuration.
#
# wasm32 builds (the `egui_mara_web` host crate, built via Trunk):
# egui pulls `ahash`, which pulls `getrandom` 0.3. On
# wasm32-unknown-unknown getrandom 0.3 has no default entropy source
# — a backend must be selected explicitly with this cfg. It is
# paired with the `getrandom = { features = ["wasm_js"] }` dep in
# `api_crates/web/Cargo.toml`; both are required. Without it the wasm
# build fails with a getrandom "unsupported target" compile error.
#
# Scoped to the wasm target, so native builds are unaffected.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']
