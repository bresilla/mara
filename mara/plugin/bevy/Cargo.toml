[package]
name = "bevy_mara"
description = "Bevy content helpers for Mara-owned applications. Mara owns egui; this crate deliberately avoids Bevy-owned egui bridge dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
# `mara_core` is still re-exported for old adapter consumers, but
# the canonical app-facing path is `mara::ui`.
mara_core = { workspace = true, features = ["bevy"] }
mara_bevy = { workspace = true }
bevy = { workspace = true, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_state",
    "bevy_log",
    "bevy_window",
    "bevy_winit",
    "bevy_input_focus",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_mesh",
    "bevy_camera",
    "bevy_image",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_scene",
    "default_font",
    "tonemapping_luts",
    "smaa_luts",
    "ktx2",
    "zstd_rust",
    "png",
    # Compile both winit windowing backends. `wayland` lets consumers
    # open native Wayland surfaces; `x11` keeps plain Xorg / XWayland
    # working as a fallback.
    "x11",
    "wayland",
    "reflect_auto_register",
] }

[features]
# Forward to mara_core's matching feature flags so consumers can
# pick which standalone extras (`mara_graph`, `mara_code`) and
# their mara-tinted wrappers compile in.
default = ["graph", "code"]
graph = ["mara_core/graph"]
code = ["mara_core/code"]
