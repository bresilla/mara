[package]
name = "mara"
description = "Unified Mara API: UI-only elements, plus optional Mara-owned native windows."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mara_gpu = { workspace = true }
mara_canvas = { workspace = true, optional = true }
mara_board = { workspace = true, optional = true }
mara_code = { workspace = true, optional = true }
mara_core = { path = "../crates/core", default-features = false }
mara_graph = { workspace = true, optional = true }
mara_image = { workspace = true, optional = true }
mara_map = { workspace = true, optional = true }
mara_3d = { workspace = true, optional = true }
mara_bevy = { workspace = true, optional = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
wgpu = { workspace = true }

# Desktop (Linux/macOS/Windows) winit backend. Excludes Android, which
# needs a different winit activity backend (see the android block below)
# and must not pull the x11/wayland features.
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
egui-winit = { version = "0.34", optional = true }
pollster = { version = "0.4", optional = true }
winit = { version = "0.30", default-features = false, features = [
    "x11",
    "wayland",
    "rwh_06",
], optional = true }

# Android winit backend. `android-native-activity` pulls `android-activity`
# with its native-activity glue (the JNI entry that calls the app's
# `android_main`) and re-exports `AndroidApp`, so no direct
# `android-activity` dependency is needed here.
[target.'cfg(target_os = "android")'.dependencies]
egui-winit = { version = "0.34", optional = true }
pollster = { version = "0.4", optional = true }
winit = { version = "0.30", default-features = false, features = [
    "android-native-activity",
    "rwh_06",
], optional = true }

[features]
default = ["canvas", "code", "graph", "image", "map"]
canvas = ["dep:mara_canvas"]
board = ["dep:mara_board"]
code = ["dep:mara_code", "mara_core/code"]
graph = ["dep:mara_graph", "mara_core/graph"]
image = ["dep:mara_image"]
map = ["dep:mara_map"]
three-d = ["dep:mara_3d", "mara_3d/gpu-preview"]
bevy = ["dep:mara_bevy"]
window = [
    "egui-wgpu/winit",
    "dep:egui-winit",
    "dep:pollster",
    "wgpu/vulkan",
    "dep:winit",
]
# Android host runner (sibling of `window`). Same plumbing, plus the GLES
# backend for broad device coverage where Vulkan is unavailable. The
# `android` module itself is additionally gated on `target_os = "android"`,
# so enabling this feature on desktop is inert.
android = [
    "egui-wgpu/winit",
    "dep:egui-winit",
    "dep:pollster",
    "dep:winit",
    "wgpu/vulkan",
    "wgpu/gles",
]
